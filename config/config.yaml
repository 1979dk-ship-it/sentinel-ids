detectors:
  port_scan:
    threshold_ports: 15
    window_seconds: 5
    cooldown_seconds: 60
  brute_force:
    ssh_threshold: 5
    ssh_window_seconds: 30
    http_threshold: 20
    http_window_seconds: 60
    https_threshold: 100
    https_window_seconds: 60
  syn_flood:
    ratio_medium: 10
    ratio_high: 50
    window_seconds: 5
    min_syn: 20
    cooldown_seconds: 60
  arp_spoof:
    gratuitous_threshold: 3
    gratuitous_window_seconds: 60
  dns_anomaly:
    query_threshold: 50
    query_window_seconds: 60
    subdomain_max_length: 50
    entropy_threshold: 3.5
    cooldown_seconds: 60
  baseline:
    interval_seconds: 10
    min_samples: 30
    z_medium: 3.0
    z_high: 5.0
    idle_evict_seconds: 3600

alerts:
  dedup_window_seconds: 60
  pcap_capture_seconds: 30

database:
  path: sentinel.db
  packet_retention_hours: 48

network:
  interface: auto

web:
  host: 127.0.0.1
  port: 8888
  poll_seconds: 1
  alert_history_seconds: 3600

response:
  direction: in          # in / out / both – which way to drop the blocked IP's traffic
  whitelist:             # IPs that can never be blocked
    - 127.0.0.1          # localhost
    - 192.168.1.1        # default gateway – blocking it would cut internet
